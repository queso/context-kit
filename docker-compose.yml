# Local development stack.
#
# Default (SQLite, no extra services):
#   docker compose up -d
#   The app stores its database in the named volume `data` (mounted at /app/data).
#
# Postgres lane (opt-in via the `postgres` profile):
#   DATABASE_URL=postgres://context_kit:context_kit@postgres:5432/context_kit \
#     docker compose --profile postgres up -d
#   Postgres is published on the host at ${POSTGRES_PORT:-5432}; set POSTGRES_PORT when
#   another Postgres already owns 5432.
#
# The app container runs as the unprivileged `node` user (1000:1000). The source tree is
# bind-mounted at /app, so on a Linux host whose user is not 1000 the container cannot write
# next-env.d.ts into it; rebuild with your own ids (shells reserve the names UID and GID):
#   APP_UID=$(id -u) APP_GID=$(id -g) docker compose up -d --build
# Docker Desktop and OrbStack map file ownership for you, so macOS and Windows need nothing.
#
# The `app` service has no depends_on so the default lane stays single-container.
# In the Postgres lane the app fails fast if Postgres is not accepting connections
# yet; `restart: unless-stopped` retries it until the healthcheck passes.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - data:/app/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:/app/data/dev.sqlite}

  postgres:
    image: postgres:17
    profiles: ["postgres"]
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: context_kit
      POSTGRES_PASSWORD: context_kit
      POSTGRES_DB: context_kit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context_kit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  data:
  pgdata:
