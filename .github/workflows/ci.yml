name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:./data/ci.sqlite

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs git auth; keep the token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Type Check
        run: bun run typecheck

      - name: Lint & Format
        run: bun run check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  postgres:
    name: Postgres
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://context_kit:context_kit@localhost:5432/context_kit

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: context_kit
          POSTGRES_PASSWORD: context_kit
          POSTGRES_DB: context_kit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U context_kit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs git auth; keep the token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Migrate
        run: bun run db:migrate

      - name: Test
        run: bun test
