name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:./data/ci.sqlite

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Type Check
        run: bun run typecheck

      - name: Lint & Format
        run: bun run check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  postgres:
    name: Postgres
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://context_kit:context_kit@localhost:5432/context_kit

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: context_kit
          POSTGRES_PASSWORD: context_kit
          POSTGRES_DB: context_kit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U context_kit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Migrate
        run: bun run db:migrate

      - name: Test
        run: bun test
